<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Поиск квартир</title>
  <link rel="stylesheet" href="/static/chat/chat.css">
  <script type="module" src="/static/chat/chat.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Поиск квартир</h1>
      <p class="hint">Напишите, что ищете, обычными словами: «двушка в Алматы до 40 млн, тихий двор».</p>
    </header>

    <section class="conversation" aria-label="Результат">
      <div class="status" role="status" aria-live="polite" hidden></div>
      <ul class="chips" aria-label="Распознанные условия" hidden></ul>
      <div class="message" hidden></div>
      <div class="layout">
        <article class="answer" aria-live="polite" aria-label="Ответ" hidden></article>
        <ol class="cards" aria-label="Найденные квартиры" hidden></ol>
      </div>
    </section>

    <form class="ask" autocomplete="off">
      <label class="visually-hidden" for="q">Запрос</label>
      <textarea id="q" name="q" rows="1" maxlength="500" required
                placeholder="Например: трёшка в Астане рядом со школой"></textarea>
      <button type="submit">Найти</button>
    </form>
  </main>
</body>
</html>
