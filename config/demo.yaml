source: synthetic_jsonl          # в проде: company_db
data_path: data/listings.jsonl

cities: [Алматы, Астана]
districts:                       # для генерации синтетики и, позже, промпта разбора
  Алматы: [Алмалинский, Ауэзовский, Бостандыкский, Жетысуский, Медеуский, Наурызбайский, Турксибский, Алатауский]
  Астана: [Есильский, Алматинский, Сарыаркинский, Байконурский, Нура]

field_map:                       # поле источника → поле listings
  price: price_kzt
  room_count: rooms
  text: description

features:                        # ключ → как пишем в search_text
  near_metro: рядом метро
  parking: паркинг
  mortgage: подходит под ипотеку
  new_building: новостройка
  near_school: рядом школа
  furnished: с мебелью

models:
  generator: claude-sonnet-5-5   # синтетика
  parser: claude-haiku-5-5       # шаг 2
  labeler: claude-opus-5-5       # разметка relevant для смысловых кейсов

embeddings:
  provider: voyage
  model: voyage-3.5
  dim: 1024                      # = vector(...) в db/schema.sql
  batch_size: 64                 # ~6–7K токенов: влезает в 10K TPM бесплатного тарифа Voyage

limits:
  daily_budget_usd: 2
  requests_per_minute_per_ip: 10
