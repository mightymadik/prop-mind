source: synthetic_jsonl          # в проде: company_db

cities: [Алматы, Астана]
districts:                       # справочник районов: генерация синтетики, схема и промпт разбора
  Алматы: [Алмалинский, Ауэзовский, Бостандыкский, Жетысуский, Медеуский, Наурызбайский, Турксибский, Алатауский]
  Астана: [Есильский, Алматинский, Сарыаркинский, Байконурский, Нура]

catalog:                         # новостройки (6.3): ЖК → квартиры; ключ → как пишем в тексте
  complexes_path: data/complexes.jsonl
  units_path: data/units.jsonl
  price_calibration_path: data/price_calibration.csv   # средние — БНС, январь 2026; районы и классы — экспертно, ноябрь 2026
  classes: {comfort: комфорт-класс, business: бизнес-класс}
  complex_features:
    near_metro: рядом метро
    near_school: рядом школа
    kindergarten: детский сад в ЖК
    near_park: рядом парк
    closed_yard: закрытый двор без машин
    parking: подземный паркинг
  payment:
    mortgage: ипотека
    installment: рассрочка от застройщика
    state_program: государственные ипотечные программы
  finishing: {rough: черновая отделка, pre_finish: предчистовая отделка, finished: чистовая отделка}
  windows: {yard: окна во двор, street: окна на улицу, both: окна на две стороны}
  views: {mountains: вид на горы, city: вид на город, park: вид на парк, river: вид на реку, none: без особого вида}
  orientations: {north: север, east: восток, south: юг, west: запад}
  price_coefs:                   # поправки к ставке за м² у синтетики (scripts/generate_catalog.py)
    first_floor: 0.95
    top_fifth: 1.03              # верхняя пятая часть дома, кроме последнего этажа
    last_floor: 0.98
    rough: 0.96                  # черновая отделка
    finished: 1.06               # чистовая
    delivered: 1.03              # дом сдан
    view_premium: 1.05           # вид на горы или реку
    max_deviation: 0.10          # итоговая ставка — не дальше ±10% от коридора калибровки

field_map: {}                    # поле источника → поле complexes / units; демо-JSONL уже в нужных полях

models:
  generator: claude-sonnet-5-5   # тексты ЖК для синтетики
  parser: claude-haiku-5-5       # шаг 2
  labeler: claude-opus-5-5       # разметка relevant для смысловых кейсов (scripts/label_catalog.py)
  judge: claude-haiku-5-5        # судья в evals ответа: узкие проверки да/нет

embeddings:
  provider: voyage
  model: voyage-3.5
  dim: 1024                      # = vector(...) в db/schema.sql
  batch_size: 64                 # ~6–7K токенов: влезает в 10K TPM бесплатного тарифа Voyage

rerank:
  provider: voyage
  model: rerank-2.5              # явно многоязычный; на dev = rerank-3 по качеству, не медленнее (decisions.md)
  candidates: 50                 # топ гибрида на переранжирование; ~6K токенов на запрос

answer:
  model: claude-sonnet-5-5       # выбор — по сравнению Sonnet/Haiku (decisions.md)
  max_tokens: 1024
  top_k: 10
  models:
    claude-sonnet-5-5:
      thinking: {type: between_tools}   # у Sonnet 5.5 так выключаются рассуждения; disabled → 400
      fallbacks: default                # серверный фолбэк при отказе (beta server-side-fallback-2026-07-01)
    claude-haiku-5-5:
      thinking: {type: disabled}        # допустимо при effort ≤ high (по умолчанию medium)

pricing:                         # $ за 1 млн токенов (прайс Anthropic)
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
  claude-haiku-5-5: {input: 0.10, output: 0.50}   # до 100K токенов в промпте
  voyage-3.5: {input: 0.06, output: 0}            # эмбеддинги; бесплатных токенов нет
  rerank-2.5: {input: 0.05, output: 0}            # 200 млн бесплатно — cost_usd считается без них
  rerank-3: {input: 0.05, output: 0}

limits:
  daily_budget_usd: 2            # сумма cost_usd в query_log за сутки; дальше — «лимит на сегодня исчерпан»
  requests_per_minute_per_ip: 10
  timezone: Asia/Almaty          # границы суток для бюджета

sites:                           # публичные site-key виджета; собственный домен ('self') разрешён всегда
  pub_demo:
    origins: []                  # сайты, которым можно встраивать чат в iframe (frame-ancestors)

moderation:                      # защита от prompt injection в описаниях (decisions.md, 6.2)
  allowed_contacts: []           # контакты, которые ответ может выводить; в демо — никаких, в проде — отдел продаж
  stuffing_min_repeats: 4        # набивка: одна основа слова ≥ 4 раз (у описаний ЖК максимум 3)…
  stuffing_min_ratio: 0.05       # …и повторов ≥ 5% слов — страховка для длинных текстов
