[project]
name = "prop-mind"
version = "0.2.0"
description = "AI-поиск недвижимости: запрос обычным языком → объекты с объяснением"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]  # примеры кода в docs оформлены вручную

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
